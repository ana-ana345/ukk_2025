<!DOCTYPE html>

<html>

<head>

  <title>Calculator</title>

  <style>

    body {
      padding: 0;
      margin: 0;
      display: flex;
      justify-content:  center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      background: silver;
    }

      font-family: sans-serif;

    }

   

    h1 {

      text-align: center right;

    }

   

    .calculator {

      display: flex;

      flex-direction: column;

      align-items: center ;

      background:deepskyblue;

      border-radius: 20px;

      border-radius: 20px;

      box-shadow: inset 0 1px 3px hotPink;

      box-shadow: 0 1px 3px hotPink;

      border: 1px solid #ccc;

      border-radius: 20px;

      padding: 10px;

      width: 290px;

   }

   

    .calculator > * {

      margin: 5px 0;
      
    }

   

    .calculator > .screen {

      width: 100%;

      height: 40px;

      font-size: 22px;

      text-align: right;

      border: 1px solid #ccc;

      border-radius: 20px;

      padding: 5px;

      box-shadow: inset 0 1px 3px Pink;

      border-radius: 20px;
    

    }

   

    .calculator > .buttons {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      grid-column-gap: 10px;

      grid-row-gap: 10px;

      

    }

   

    .calculator > .buttons > button {
    
      width: 100%;

      height: 40px;

      font-size: 22px;

      background: deepskyblue;

      border-radius: 20px;

      border: 1px solid #ccc;

      border-radius: 20px;

      cursor: pointer;

      box-shadow: 0 1px 3px black;

    }

   

    .calculator > .buttons > button:hover {

      background: hotpink;

    }

   

    .calculator > .buttons > button.special {

      background:hotpink;

      box-shadow: hotPink;

      

    }

   

    .calculator > .buttons > button.special:hover {

      background:hotpink;

    }

  </style>

</head>

<body>
   

  <div class="calculator">

     <h2><marquee direction="left"><b>kalkulator ana</b></marquee></h2>

    <input type="text" class="screen" placeholder="0" />

    <div class="buttons">

      <button onclick="clearInput()" class="special">C</button>

      <button onclick="deleteLastChar()" class="special">Del</button>

      <button onclick="addToInput(0)"class="special">0</button>

      <button onclick="addToInput('*')" class="special">*</button>

      <button onclick="addToInput(7)"class="special">7</button>

      <button onclick="addToInput(8)"class="special">8</button>

      <button onclick="addToInput(9)"class="special">9</button>

      <button onclick="addToInput('+')" class="special">+</button>

      <button onclick="addToInput(4)"class="special">4</button>

      <button onclick="addToInput(5)"class="special">5</button>

      <button onclick="addToInput(6)"class="special">6</button>

      <button onclick="addToInput('-')" class="special">-</button>

      <button onclick="addToInput(1)"class="special">1</button>

      <button onclick="addToInput(2)"class="special">2</button>

      <button onclick="addToInput(3)"class="special">3</button>

      <button onclick="calculate('/')" class="special">/</button>

      <button onclick="addToInput()"class="special">=</button>

      <button onclick="addToInput('.')" class="special">.</button>

    </div>

  </div>

  <script>

    function addToInput(num) {

      var input = document.querySelector('.calculator .screen');

      input.value = input.value + num;

    }

   

    function calculate() {

      var input = document.querySelector('.calculator .screen');

      var result = eval(input.value); // Evaluate the input string as an expression

      result = parseInt(result); // Convert the result to an integer

      input.value = result;

    }

   

    function clearInput() {

      var input = document.querySelector('.calculator .screen');

      input.value = '0';

    }

   

    function deleteLastChar() {

      var input = document.querySelector('.calculator .screen');

      input.value = input.value.slice(0, -1);

    }

  </script>

</body>

</html>
